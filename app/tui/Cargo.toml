[package]
name = "puppy-tui"
version = "0.1.0"
edition = "2021"
description = "Terminal UI dashboard for puppy-server"
license = "MIT"

[dependencies]
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "2"
futures-util = "0.3"

[profile.release]
strip = true
lto = true
