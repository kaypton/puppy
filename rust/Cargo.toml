[workspace]
resolver = "2"
members = [
	"crates/puppy-core",
	"crates/config",
	"crates/direct",
	"crates/httpproxy-fe",
	"crates/socksproxy-fe",
	"crates/httpproxy-be",
	"crates/socksproxy-be",
	"crates/tun",
	"crates/puppy-rpc",
	"crates/puppy-observability",
	"crates/puppy-tui",
	"crates/server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "MIT"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal", "fs"] }
tokio-stream = { version = "0.1", features = ["net", "sync"] }
tokio-util = "0.7"
# Serialization
serde = { version = "1", features = ["derive"] }
toml = "0.8"
# CLI
clap = { version = "4", features = ["derive"] }
# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# TLS
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
rustls-pemfile = "2"
rustls-native-certs = "0.8"
# HTTP parsing
httparse = "1"
# Encoding
base64 = "0.22"
# Constant-time comparison
subtle = "2"
# Random
rand = "0.8"
# User-space netstack (TUN only)
smoltcp = { version = "=0.11.0", default-features = false }
# Syscalls
nix = { version = "0.29", features = ["net", "socket", "ioctl", "fs"] }
libc = "0.2"
# Socket control
socket2 = "0.5"
# Sync primitives
parking_lot = "0.12"
# Errors
thiserror = "1"
anyhow = "1"
# RPC and persistence
tonic = { version = "0.12", features = ["tls", "transport"] }
prost = "0.13"
prost-types = "0.13"
rusqlite = { version = "0.32", features = ["bundled"] }
tracing-appender = "0.2"
# Terminal UI
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
futures-util = "0.3"
serde_json = "1"
# Bytes
bytes = "1"
# Async trait
async-trait = "0.1"
# Testing
assert_cmd = "2"
tokio-test = "0.4"

[profile.release]
lto = true
codegen-units = 1
strip = true
