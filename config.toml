# Puppy 代理服务配置示例。
#
# frontend 指定要启动的 frontend 配置组名称。
# 该值必须与下方 [frontends.<名称>] 中的一个名称完全一致。
# 本示例默认启动 local_http_proxy；配置组名称可按需修改。
frontend = "local_http_proxy"

# HTTP CONNECT frontend 配置。
# local_http_proxy 是用户自定义的配置组名称。
[frontends.local_http_proxy]
# type 决定该配置组使用哪一种 frontend 实现。
# 当前支持的 frontend 类型：httpproxy。
type = "httpproxy"

# listen_address 是代理服务监听的本地 IP 地址。
# 127.0.0.1 仅允许本机访问；如需接受外部连接可改为 0.0.0.0。
listen_address = "127.0.0.1"

# listen_port 是代理服务监听的 TCP 端口，取值范围为 1 到 65535。
listen_port = 8848

# 配置 tls_cert_file 和 tls_key_file 后，frontend 将通过 HTTPS 接受代理连接。
# 两项必须同时配置；同时省略时继续使用普通 HTTP。相对路径基于进程工作目录。
# 可运行 scripts/generate-proxy-certs.sh 生成本地开发证书，并让客户端信任
# certs/ca-cert.pem。使用 IP 连接时，该 IP 必须包含在服务证书的 SAN 中。
tls_cert_file = "./certs/proxy-cert.pem"
tls_key_file = "./certs/proxy-key.pem"

# username 是客户端连接此 HTTP 代理时使用的 Basic Auth 用户名。
# username 和 password 必须同时填写或同时留空；同时留空表示不启用认证。
username = "test"

# password 是客户端连接此 HTTP 代理时使用的 Basic Auth 密码。
# 生产环境启用认证时，请妥善限制此配置文件的读取权限。
password = "test12345"

# camouflage 启用后，服务会隐藏代理专用的认证失败响应。
# 普通 HTTP 请求将得到 404，认证失败的 CONNECT 请求将得到 405。
camouflage = true

# camouflage_method 决定伪装方式；省略或留空时默认为 return-404。
# 当前支持的值：return-404。
camouflage_method = "return-404"

# backend 指定此 frontend 使用的 backend 配置组名称。
# 本示例使用 direct_out；如需通过上游 HTTP 代理转发，可改为 upstream_http_proxy。
backend = "direct_out"

# shim 指定此 frontend 使用的 shim 配置组名称。
# 该值必须与下方 [shims.<名称>] 中的一个名称完全一致。
shim = "default_tunnel"

# Direct backend 配置。
# direct_out 是用户自定义的配置组名称。
[backends.direct_out]
# type 决定该配置组使用哪一种 backend 实现。
# direct 表示不经过其他代理，直接连接客户端请求的目标地址。
type = "direct"

# Direct backend 当前没有其他实现专属配置选项。

# 上游 HTTP CONNECT proxy backend 配置。
# 该配置组默认未被 local_http_proxy 使用，但会在启动时被严格校验。
[backends.upstream_http_proxy]
# type=httpproxy 表示通过另一个 HTTP CONNECT 代理连接最终目标。
type = "httpproxy"

# proxy_address 是上游 HTTP 代理的地址，必须使用 host:port 格式。
# IPv6 地址需要使用方括号，例如 [2001:db8::1]:3128。
proxy_address = "127.0.0.1:3128"

# username 是连接上游 HTTP 代理时使用的 Basic Auth 用户名。
# username 和 password 必须同时填写或同时留空；同时留空表示上游无需认证。
username = ""

# password 是连接上游 HTTP 代理时使用的 Basic Auth 密码。
password = ""

# tls 启用后，backend 将通过 TLS 连接上游 HTTP 代理（即 https_proxy=https://...）。
# 省略或为 false 时仍使用明文 TCP。下面的 tls_* 字段仅在 tls = true 时有效。
tls = false

# tls_ca_file 指定用于校验上游代理服务器证书的 CA 文件（PEM 格式）。
# 省略时使用系统根证书；可指向本地开发 CA，例如 ./certs/ca-cert.pem。
# 与 tls_insecure_skip_verify 互斥。
# tls_ca_file = "./certs/ca-cert.pem"

# tls_server_name 覆盖 TLS SNI 与证书校验名。
# 省略时取 proxy_address 的 host 部分。当上游证书 CN/SAN 与 proxy_address 不一致时使用。
# tls_server_name = "proxy.internal"

# tls_insecure_skip_verify 为 true 时跳过上游代理证书校验，仅用于测试。
# 与 tls_ca_file 互斥。
# tls_insecure_skip_verify = false

# TUN 模式 frontend 配置（默认未启用，将上方 frontend 改为 local_tun 即可使用）。
# TUN 模式会创建虚拟网卡接管系统默认路由，将本机全部 TCP/UDP 流量经 backend 转发。
# 需要 root 权限运行：sudo bin/puppy-server --config ./config.toml。
# 仅支持 macOS（utun）与 Linux（tun）。
[frontends.local_tun]
# type=tun 表示使用 TUN 模式 frontend。
type = "tun"

# device_name 指定虚拟网卡名称。留空时由系统自动分配（macOS: utunN, Linux: tunN）。
# macOS 下可填 "utun5" 等指定具体 unit；Linux 下可填 "tun0" 等。
device_name = ""

# ipv4_address 是 TUN 网卡的 IPv4 地址，必须使用 CIDR 格式。
# IPv4/IPv6 至少配置一个；地址会同时配置到系统接口和 gVisor netstack，
# 因此应选择不与本地网络冲突的网段，例如 10.0.0.1/24。
ipv4_address = "10.0.0.1/24"

# ipv6_address 可选，配置 TUN 网卡的 IPv6 地址，CIDR 格式。
# ipv6_address = "fd00::1/64"

# mtu 是虚拟网卡的最大传输单元，省略或为 0 时使用默认值 1500。
mtu = 1500

# auto_route 为 true（默认）时，启动会通过两条 /1 分流路由接管流量，
# 同时保留原默认路由，并把 backend 及其 DNS socket 绑定到原物理出口，
# 避免出站流量再次进入 TUN。退出时删除分流路由。
# 如果已有 VPN/TUN 正在通过更具体的路由接管公网流量，启动会在修改系统
# 网络前直接失败；请先关闭已有 VPN，或设为 false 后自行管理兼容路由。
# 设为 false 时仍会配置并启用 TUN 接口，但路由和 backend 绕行由用户负责。
auto_route = true

# udp_idle_timeout 是 UDP 会话空闲超时秒数，超时后关闭该会话。
# 省略或 <=0 时使用默认值 30 秒。
udp_idle_timeout = 30

# backend 指定此 frontend 使用的 backend 配置组名称。
backend = "direct_out"

# shim 指定此 frontend 使用的 shim 配置组名称。
shim = "default_tunnel"

# Shim server 配置。
# default_tunnel 是用户自定义的配置组名称，可被多个 frontend 复用。
[shims.default_tunnel]
# buffer_size 是隧道双向复制时，每个方向使用的缓冲区字节数。
# 设置为 0 或省略该选项时使用内置默认值 32768（32 KiB）；负数无效。
buffer_size = 32768
