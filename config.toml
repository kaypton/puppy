# Puppy proxy server configuration example.
#
# frontend selects the frontend group to start. Its value must exactly match one
# of the names under [frontends.<name>]. This example starts local_http_proxy.
frontend = "local_http_proxy"

# HTTP CONNECT frontend. local_http_proxy is a user-defined group name.
[frontends.local_http_proxy]
# Supported frontend types are httpproxy, socksproxy, grpcproxy, and tun.
type = "httpproxy"

# Listener IP address. 127.0.0.1 accepts local connections only; use 0.0.0.0
# to accept remote connections. Write IPv6 addresses without brackets.
listen_address = "127.0.0.1"

# Listener TCP port, from 1 through 65535.
listen_port = 8848

# Setting both fields enables HTTPS proxy connections. They must be supplied
# together; omit both to use plaintext HTTP. Relative paths use the process
# working directory. scripts/generate-proxy-certs.sh creates development
# certificates. An IP used by clients must appear in the certificate SAN.
tls_cert_file = "./certs/proxy-cert.pem"
tls_key_file = "./certs/proxy-key.pem"

# Basic Authentication credentials. Set both or leave both empty to disable
# authentication. Protect this file when it contains production credentials.
username = "test"
password = "test12345"

# Camouflage hides proxy-specific authentication failures. Ordinary HTTP
# requests receive 404 and unauthenticated CONNECT requests receive 405.
camouflage = true

# The supported camouflage method is currently return-404.
camouflage_method = "return-404"

# Backend group used by this frontend. Replace direct_out with
# upstream_http_proxy or upstream_socks_proxy to chain through another proxy.
backend = "direct_out"

# Shim group used by this frontend.
shim = "default_tunnel"

# Direct backend. It connects to requested targets without another proxy.
[backends.direct_out]
type = "direct"

# Upstream HTTP CONNECT backend. This group is not selected by default, but it
# is still validated at startup.
[backends.upstream_http_proxy]
type = "httpproxy"

# Upstream address in host:port form. Enclose IPv6 addresses in brackets.
proxy_address = "127.0.0.1:3128"

# Upstream Basic Authentication. Set both fields or leave both empty.
username = ""
password = ""

# Connect to the upstream proxy with TLS. The tls_* settings below apply only
# when this value is true.
tls = false

# CA certificate used to verify the upstream server. Omission uses system roots.
# This setting is mutually exclusive with tls_insecure_skip_verify.
# tls_ca_file = "./certs/ca-cert.pem"

# Override the TLS SNI and certificate verification name. Omission uses the
# host part of proxy_address.
# tls_server_name = "proxy.internal"

# Skip upstream certificate verification. Use only for tests. This setting is
# mutually exclusive with tls_ca_file.
# tls_insecure_skip_verify = false

# Upstream SOCKS5 backend. This group is not selected by default, but it is
# still validated at startup.
[backends.upstream_socks_proxy]
type = "socksproxy"

# Upstream address in host:port form. Enclose IPv6 addresses in brackets.
proxy_address = "127.0.0.1:1080"

# Optional RFC 1929 credentials. Set both fields or leave both empty.
username = ""
password = ""

# Connect to the upstream SOCKS5 proxy with TLS. The tls_* settings below apply
# only when this value is true.
tls = false

# CA certificate used to verify the upstream server. Omission uses system roots.
# This setting is mutually exclusive with tls_insecure_skip_verify.
# tls_ca_file = "./certs/ca-cert.pem"

# Override the TLS SNI and certificate verification name. Omission uses the
# host part of proxy_address.
# tls_server_name = "proxy.internal"

# Skip upstream certificate verification. Use only for tests. This setting is
# mutually exclusive with tls_ca_file.
# tls_insecure_skip_verify = false

# Upstream gRPC tunnel backend. It connects to a remote gRPC tunnel server (see
# the grpcproxy frontend below) and tunnels traffic over a bidirectional stream.
# This group is commented out; enable it by removing the leading "# " and
# pointing a frontend's backend at upstream_grpc_tunnel.
# [backends.upstream_grpc_tunnel]
# type = "grpcproxy"

# Address of the remote gRPC tunnel server in host:port form. Enclose IPv6
# addresses in brackets.
# server_address = "tunnel.example.com:443"

# Connect to the tunnel server with TLS. The tls_* settings below apply only
# when this value is true.
# tls = true

# CA certificate used to verify the tunnel server. Omission uses system roots.
# This setting is mutually exclusive with tls_insecure_skip_verify.
# tls_ca_file = "./certs/ca-cert.pem"

# Override the TLS SNI and certificate verification name. Omission uses the
# host part of server_address.
# tls_server_name = "tunnel.internal"

# Skip tunnel server certificate verification. Use only for tests. This setting
# is mutually exclusive with tls_ca_file.
# tls_insecure_skip_verify = false

# Bearer token sent in the Authorization metadata. It must match the token of
# the remote grpcproxy frontend; empty disables authentication.
# token = "replace-with-a-long-random-token"

# SOCKS5 frontend. Select it with frontend = "local_socks_proxy". It supports
# CONNECT (TCP), with optional RFC 1929 authentication. Optional non-standard
# SOCKS5-over-TLS requires clients to establish TLS before the SOCKS5 handshake.
[frontends.local_socks_proxy]
type = "socksproxy"

# Listener IP address. Write IPv6 addresses without brackets.
listen_address = "127.0.0.1"

# Listener TCP port, from 1 through 65535.
listen_port = 1080

# Set both fields to enable SOCKS5-over-TLS, or omit both for plaintext SOCKS5.
# Relative paths use the process working directory.
# tls_cert_file = "./certs/proxy-cert.pem"
# tls_key_file = "./certs/proxy-key.pem"

# Optional RFC 1929 credentials. Set both fields or leave both empty.
username = "test"
password = "test12345"

# Backend and shim groups used by this frontend.
backend = "direct_out"
shim = "default_tunnel"

# gRPC tunnel frontend. Select it with frontend = "local_grpc_tunnel". It
# accepts gRPC bidirectional-streaming tunnel requests from a remote grpcproxy
# backend and forwards the traffic to the configured backend. This group is
# commented out; enable it by removing the leading "# ".
# [frontends.local_grpc_tunnel]
# type = "grpcproxy"

# Listener IP address. 127.0.0.1 accepts local connections only; use 0.0.0.0
# to accept remote tunnel clients. Write IPv6 addresses without brackets.
# listen_address = "127.0.0.1"

# Listener TCP port, from 1 through 65535.
# listen_port = 9443

# Set both fields to require TLS from tunnel clients, or omit both for
# plaintext gRPC. Relative paths use the process working directory.
# tls_cert_file = "./certs/proxy-cert.pem"
# tls_key_file = "./certs/proxy-key.pem"

# Bearer token required in the Authorization metadata of every tunnel request.
# It must match the token of the remote grpcproxy backend; empty disables
# authentication.
# token = "replace-with-a-long-random-token"

# Backend and shim groups used by this frontend.
# backend = "direct_out"
# shim = "default_tunnel"

# TUN frontend. Select it with frontend = "local_tun". It creates a virtual
# interface and forwards host TCP/UDP traffic. It requires root privileges and
# supports macOS utun and Linux tun.
[frontends.local_tun]
type = "tun"

# Virtual interface name. Empty lets the OS assign one, such as utunN or tunN.
device_name = ""

# Interface addresses in CIDR form. At least one of IPv4 or IPv6 is required.
# Choose a range that does not conflict with local networks.
ipv4_address = "10.0.0.1/24"
# ipv6_address = "fd00::1/64"

# Interface MTU. Zero or omission uses 1500.
mtu = 1500

# Automatic routing installs two /1 split routes while preserving the original
# default route, and binds backend and DNS sockets to the original physical
# egress to prevent loops. Routes are removed on exit. Startup fails before
# changing the network if another VPN owns more specific public routes. Set
# false only when routes and backend bypasses are managed externally.
auto_route = true

# UDP session idle timeout in seconds. A non-positive value uses 30 seconds.
udp_idle_timeout = 30

# Optional DNS resolver as an IP literal with a port. TCP and UDP traffic to
# port 53 is redirected here; UDP requests are converted to DNS-over-TCP. Host
# names are rejected to avoid DNS bootstrap recursion.
#
# On Linux with auto_route and ipv4_address enabled, nft also intercepts local
# queries to systemd-resolved at 127.0.0.53:53. nft must be installed. This
# loopback interception is not enabled with auto_route=false, IPv6-only, or macOS.
# dns_server = "1.1.1.1:53"
# dns_server = "[2606:4700:4700::1111]:53"

# Candidate backends in priority order. HTTP CONNECT and SOCKS5 backends support
# TCP only, so unsupported UDP continues to fallback. A failed dial does not
# trigger fallback. The legacy backend = "direct_out" form is also accepted,
# but it is mutually exclusive with backends.
backends = ["direct_out"]

# Used when every candidate backend rejects the traffic type. Omission uses the
# built-in direct backend. An explicit fallback must support arbitrary TCP/UDP.
fallback = "direct_out"

# TCP application protocol detection limits. Detection recognizes HTTP/1,
# HTTP/2 client prefaces, and TLS ClientHello, then replays the full buffer.
protocol_detect_timeout = 1
protocol_detect_max_bytes = 16384

# Shim group used by this frontend.
shim = "default_tunnel"

# Reusable bidirectional tunnel settings.
[shims.default_tunnel]
# Per-direction copy buffer in bytes. Zero or omission uses 32768; negative
# values are invalid.
buffer_size = 32768

# Read-only gRPC observability API consumed by puppy-tui.
[grpc]
enabled = true

# Management listener. Prefer 127.0.0.1; protect remote listeners with network
# controls and, where appropriate, TLS and authentication.
listen_address = "127.0.0.1"
listen_port = 50051

# Optional gRPC TLS. Set both fields or omit both for plaintext HTTP. These may
# reuse the proxy certificate or point to a separately generated certificate.
tls_cert_file = "./certs/proxy-cert.pem"
tls_key_file = "./certs/proxy-key.pem"

# Optional Bearer token. A non-empty value is required in the Authorization
# header for every RPC; an empty value disables authentication.
token = "replace-with-a-long-random-token"

# Connection history and structured log storage. Relative paths use the
# directory containing this configuration file.
[observability]
database_path = "./data/puppy-observability.sqlite3"
log_directory = "./logs"
checkpoint_interval_ms = 1000

# Zero means unlimited retention.
connection_retention_days = 0
connection_max_rows = 0
log_retention_days = 0
log_max_total_bytes = 0
